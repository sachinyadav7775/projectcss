<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration Form</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="main">

            <div class="shape">

                <div id="page">
                    <h3>Registration Form</h3>
                    <form>

                    </form>
                </div>

            </div>

        </div>

    </body>

</html>
